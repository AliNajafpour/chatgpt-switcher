name: Windows checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  self-checks:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Core self-check
        shell: pwsh
        run: |
          & '${{ matrix.shell }}' -NoProfile -ExecutionPolicy Bypass -STA -File ./self-check.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: CLI self-check
        shell: pwsh
        run: |
          & '${{ matrix.shell }}' -NoProfile -ExecutionPolicy Bypass -STA -File ./cli-self-check.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: UI self-check
        shell: pwsh
        run: |
          & '${{ matrix.shell }}' -NoProfile -ExecutionPolicy Bypass -STA -File ./ui-self-check.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
